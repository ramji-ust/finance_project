{% extends 'base.html' %}
 
{% block content %}
<h2 class="mb-4">SIP Calculator</h2>
 
<form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
<div class="mb-3">
<label class="form-label">Monthly Investment (₹):</label>
<input type="number" name="monthly_investment" class="form-control" required>
</div>
 
    <div class="mb-3">
<label class="form-label">Annual Interest Rate (%):</label>
<input type="number" step="0.01" name="annual_rate" class="form-control" required>
</div>
 
    <div class="mb-3">
<label class="form-label">Tenure (Years):</label>
<input type="number" name="tenure_years" class="form-control" required>
</div>
 
    <button type="submit" class="btn btn-primary">Calculate Maturity Amount</button>
</form>
 
{% if result %}
<div class="alert alert-success mt-4">
<strong>Maturity Amount:</strong> ₹{{ result }}
</div>
{% endif %}
{% endblock %}
