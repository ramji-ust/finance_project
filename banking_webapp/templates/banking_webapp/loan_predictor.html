{% extends "base.html" %}

{% block content %}
  <h2>Loan Amount Estimator</h2>
  <form method="post">
    {% csrf_token %}
    <label>Age:</label><input type="number" name="age" required><br><br>
    <label>Monthly Income (₹):</label><input type="number" name="monthly_income" required><br><br>
    <label>Credit Score (300–850):</label><input type="number" name="credit_score" min="300" max="850" required><br><br>
    <label>Loan Tenure (Years):</label><input type="number" name="loan_tenure" required><br><br>
    <label>Existing Loan Amount (₹):</label><input type="number" name="existing_loan" required><br><br>
    <label>Number of Dependents:</label><input type="number" name="dependents" required><br><br>
    <button type="submit">Estimate</button>
  </form>

  {% if prediction %}
    <h3>Predicted Loan Amount: ₹ {{ prediction|floatformat:2 }}</h3>
  {% endif %}
{% endblock %}
