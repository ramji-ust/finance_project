{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">EMI Calculator</h2>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="principal" class="form-label">Loan Amount (₹)</label>
            <input type="number" step="0.01" name="principal" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="rate" class="form-label">Annual Interest Rate (%)</label>
            <input type="number" step="0.01" name="rate" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="tenure" class="form-label">Loan Tenure (Years)</label>
            <input type="number" name="tenure" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Calculate EMI</button>
    </form>

    {% if emi %}
        <div class="alert alert-success mt-4">
            <strong>Your EMI:</strong> ₹{{ emi }}
        </div>
    {% elif error %}
        <div class="alert alert-danger mt-4">
            {{ error }}
        </div>
    {% endif %}
</div>
{% endblock %}
