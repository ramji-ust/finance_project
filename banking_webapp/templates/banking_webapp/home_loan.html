{% extends 'base.html' %}
 
{% block content %}
<h2 class="mb-4">Home Loan Eligibility Estimator</h2>
 
<form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
 
    <div class="mb-3">
<label class="form-label">Monthly Income (₹):</label>
<input type="number" name="income" class="form-control" required>
</div>
 
    <div class="mb-3">
<label class="form-label">Monthly Expenses (₹):</label>
<input type="number" name="expenses" class="form-control" required>
</div>
 
    <div class="mb-3">
<label class="form-label">Loan Term (Years):</label>
<input type="number" name="loan_term_years" class="form-control" value="20" required>
</div>
 
    <div class="mb-3">
<label class="form-label">Interest Rate (%):</label>
<input type="number" name="interest_rate" step="0.01" class="form-control" value="7" required>
</div>
 
    <button type="submit" class="btn btn-primary">Estimate Loan Eligibility</button>
</form>
 
{% if result is not None %}
<div class="alert alert-info mt-4">
<strong>Estimated Eligible Loan Amount:</strong> ₹{{ result }}
</div>
{% endif %}
{% endblock %}
