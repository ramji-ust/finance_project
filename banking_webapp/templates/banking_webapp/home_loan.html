{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Home Loan Eligibility Estimator</h2>

    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}

        <div class="mb-3">
            <label for="income" class="form-label">Monthly Income (₹)</label>
            <input type="number" name="income" id="income" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="expenses" class="form-label">Monthly Expenses (₹)</label>
            <input type="number" name="expenses" id="expenses" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="loan_term_years" class="form-label">Loan Term (Years)</label>
            <input type="number" name="loan_term_years" id="loan_term_years" class="form-control" value="20" required>
        </div>

        <div class="mb-3">
            <label for="interest_rate" class="form-label">Interest Rate (%)</label>
            <input type="number" name="interest_rate" id="interest_rate" step="0.01" class="form-control" value="7" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Estimate Loan Eligibility</button>
    </form>

    {% if result is not None %}
        <div class="alert alert-info mt-4">
            <strong>Estimated Eligible Loan Amount:</strong> ₹{{ result }}
        </div>
    {% endif %}
</div>
{% endblock %}
